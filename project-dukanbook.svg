<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="50%" stop-color="#141724" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2235" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#121522" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="green-pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="180" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="220" fill="#6366f1" opacity="0.1" filter="url(#glow)" />

  <!-- App Container / Window Frame -->
  <rect x="60" y="40" width="1080" height="595" rx="18" fill="#0f121d" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="40" width="1080" height="52" rx="18" fill="#171b2a" />
  <rect x="60" y="74" width="1080" height="18" fill="#171b2a" />
  <line x1="60" y1="92" x2="1140" y2="92" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="95" cy="66" r="6" fill="#ef4444" />
  <circle cx="115" cy="66" r="6" fill="#f59e0b" />
  <circle cx="135" cy="66" r="6" fill="#10b981" />

  <!-- URL Bar -->
  <rect x="220" y="52" width="600" height="28" rx="7" fill="#0c0e17" stroke="rgba(255,255,255,0.06)" />
  <text x="240" y="71" font-family="'Inter', sans-serif" font-size="12" fill="#9ca3af">🔒 https://abc-alpha-two.vercel.app/ (Live Production)</text>

  <!-- Status Badge -->
  <rect x="940" y="52" width="170" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
  <circle cx="958" cy="66" r="4" fill="#10b981" />
  <text x="970" y="71" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10b981">LIVE APPLICATION</text>

  <!-- Sidebar -->
  <rect x="60" y="93" width="220" height="542" fill="#131726" />
  <line x1="280" y1="93" x2="280" y2="635" stroke="rgba(255,255,255,0.08)" />

  <!-- Sidebar Logo -->
  <text x="95" y="145" font-family="'Inter', sans-serif" font-size="22">📒</text>
  <text x="128" y="140" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff">DukanBook</text>
  <text x="128" y="156" font-family="'Inter', sans-serif" font-size="11" fill="#f59e0b">Smart Business Tracker</text>

  <!-- Nav Items -->
  <rect x="75" y="185" width="190" height="38" rx="8" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="1" />
  <text x="95" y="209" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#fbbf24">🏠 Dashboard / डैशबोर्ड</text>

  <text x="95" y="252" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">💰 Add Sale / बिक्री</text>
  <text x="95" y="292" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">🛒 Purchases / खरीद</text>
  <text x="95" y="332" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">💸 Expenses / खर्च</text>
  <text x="95" y="372" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">📦 Inventory / स्टॉक</text>
  <text x="95" y="412" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">📊 Reports / रिपोर्ट</text>
  <text x="95" y="452" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">⚙️ Settings / सेटिंग</text>

  <!-- Main Content Dashboard -->
  <text x="315" y="140" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Dashboard Overview</text>
  <text x="315" y="160" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Real-time daily revenue, store inventory &amp; profit tracking</text>

  <!-- Metric Cards -->
  <!-- Card 1 -->
  <rect x="315" y="185" width="180" height="95" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
  <text x="330" y="212" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Total Sales / कुल बिक्री</text>
  <text x="330" y="246" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#10b981">₹1,48,250</text>
  <text x="330" y="266" font-family="'Inter', sans-serif" font-size="10" fill="#10b981">▲ +14.2% this week</text>

  <!-- Card 2 -->
  <rect x="510" y="185" width="180" height="95" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
  <text x="525" y="212" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Net Profit / शुद्ध लाभ</text>
  <text x="525" y="246" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#f59e0b">₹42,890</text>
  <text x="525" y="266" font-family="'Inter', sans-serif" font-size="10" fill="#f59e0b">● 28.9% Margin</text>

  <!-- Card 3 -->
  <rect x="705" y="185" width="180" height="95" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
  <text x="720" y="212" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Stock Value / स्टॉक</text>
  <text x="720" y="246" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#60a5fa">₹3,92,400</text>
  <text x="720" y="266" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">432 Items in stock</text>

  <!-- Card 4 -->
  <rect x="900" y="185" width="210" height="95" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
  <text x="915" y="212" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Pending Udhaar / उधार</text>
  <text x="915" y="246" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#ef4444">₹18,500</text>
  <text x="915" y="266" font-family="'Inter', sans-serif" font-size="10" fill="#ef4444">12 Customers</text>

  <!-- Chart Box -->
  <rect x="315" y="300" width="490" height="295" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
  <text x="335" y="332" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Weekly Revenue Trends</text>
  <text x="335" y="348" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Comparison with previous billing cycle</text>

  <!-- Simulated SVG Line Chart -->
  <path d="M 345,540 C 400,510 440,530 480,480 C 520,430 560,460 610,400 C 660,340 700,380 770,360 L 770,550 L 345,550 Z" fill="url(#primary-glow)" opacity="0.18" />
  <path d="M 345,540 C 400,510 440,530 480,480 C 520,430 560,460 610,400 C 660,340 700,380 770,360" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="610" cy="400" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
  <circle cx="770" cy="360" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />

  <!-- Chart Axis Labels -->
  <text x="345" y="568" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Mon</text>
  <text x="415" y="568" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Tue</text>
  <text x="485" y="568" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Wed</text>
  <text x="555" y="568" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Thu</text>
  <text x="625" y="568" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Fri</text>
  <text x="695" y="568" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Sat</text>
  <text x="760" y="568" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Sun</text>

  <!-- Right Panel: Recent Sales Ledger -->
  <rect x="820" y="300" width="290" height="295" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" />
  <text x="840" y="332" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Recent Transactions</text>

  <!-- Transaction Rows -->
  <g transform="translate(840, 360)">
    <circle cx="16" cy="16" r="16" fill="rgba(16,185,129,0.15)" />
    <text x="16" y="21" font-size="12" text-anchor="middle" fill="#10b981">₹</text>
    <text x="42" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffffff">Sharma Grocery Order</text>
    <text x="42" y="27" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Cash Sale • 2m ago</text>
    <text x="250" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#10b981">+₹1,240</text>
  </g>

  <g transform="translate(840, 420)">
    <circle cx="16" cy="16" r="16" fill="rgba(99,102,241,0.15)" />
    <text x="16" y="21" font-size="12" text-anchor="middle" fill="#6366f1">💳</text>
    <text x="42" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffffff">UPI Digital Payment</text>
    <text x="42" y="27" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">PhonePe QR • 18m ago</text>
    <text x="250" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#10b981">+₹3,450</text>
  </g>

  <g transform="translate(840, 480)">
    <circle cx="16" cy="16" r="16" fill="rgba(239,68,68,0.15)" />
    <text x="16" y="21" font-size="12" text-anchor="middle" fill="#ef4444">📦</text>
    <text x="42" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffffff">FMCG Wholesaler Supply</text>
    <text x="42" y="27" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Stock Restock • 1h ago</text>
    <text x="250" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#ef4444">-₹12,800</text>
  </g>

  <g transform="translate(840, 540)">
    <circle cx="16" cy="16" r="16" fill="rgba(245,158,11,0.15)" />
    <text x="16" y="21" font-size="12" text-anchor="middle" fill="#f59e0b">📒</text>
    <text x="42" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ffffff">Khata Credit Cleared</text>
    <text x="42" y="27" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Verma Ji • 3h ago</text>
    <text x="250" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="end" fill="#10b981">+₹2,100</text>
  </g>
</svg>
