<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="lu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#141124" />
      <stop offset="100%" stop-color="#07060d" />
    </linearGradient>
    <linearGradient id="lu-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="lu-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#lu-bg)" />
  <circle cx="300" cy="200" r="280" fill="#ec4899" opacity="0.12" filter="url(#lu-glow)" />
  <circle cx="900" cy="450" r="300" fill="#8b5cf6" opacity="0.14" filter="url(#lu-glow)" />

  <!-- Frame -->
  <rect x="70" y="45" width="1060" height="585" rx="16" fill="#09090e" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Header -->
  <rect x="70" y="45" width="1060" height="50" rx="16" fill="#11111a" />
  <rect x="70" y="78" width="1060" height="17" fill="#11111a" />
  <line x1="70" y1="95" x2="1130" y2="95" stroke="rgba(255,255,255,0.08)" />

  <circle cx="102" cy="70" r="5.5" fill="#ef4444" />
  <circle cx="120" cy="70" r="5.5" fill="#f59e0b" />
  <circle cx="138" cy="70" r="5.5" fill="#10b981" />

  <rect x="250" y="56" width="500" height="28" rx="6" fill="#06060a" stroke="rgba(255,255,255,0.06)" />
  <text x="270" y="75" font-family="'Inter', sans-serif" font-size="12" fill="#8888aa">https://luminastudio.design/experience</text>

  <!-- Studio Header -->
  <text x="120" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="1.5">LUMINA.</text>
  <text x="750" y="145" font-family="'Inter', sans-serif" font-size="13" fill="#a1a1aa">Selected Works</text>
  <text x="880" y="145" font-family="'Inter', sans-serif" font-size="13" fill="#a1a1aa">Philosophy</text>
  <text x="980" y="145" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ec4899">Let's Talk ↗</text>

  <!-- Big Studio Headline -->
  <text x="120" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="#ffffff">IMMERSIVE</text>
  <text x="120" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="url(#lu-accent)">DIGITAL WORLDS.</text>

  <text x="120" y="340" font-family="'Inter', sans-serif" font-size="16" fill="#9ca3af" max-width="500">We craft sensory brand experiences, high-concept websites, and fluid WebGL interactions.</text>

  <!-- Showcase Cards within mockup -->
  <g transform="translate(120, 380)">
    <rect x="0" y="0" width="300" height="210" rx="14" fill="#171724" stroke="rgba(255,255,255,0.08)" />
    <!-- Gradient Art inside card 1 -->
    <rect x="15" y="15" width="270" height="130" rx="8" fill="#201a35" />
    <circle cx="150" cy="80" r="45" fill="url(#lu-accent)" opacity="0.6" />
    <text x="25" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Aura Spatial Sound</text>
    <text x="25" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#8888aa">3D Audio Experience • Awwwards Site of the Day</text>
  </g>

  <g transform="translate(450, 380)">
    <rect x="0" y="0" width="300" height="210" rx="14" fill="#171724" stroke="rgba(255,255,255,0.08)" />
    <!-- Gradient Art inside card 2 -->
    <rect x="15" y="15" width="270" height="130" rx="8" fill="#1e1828" />
    <path d="M 40,110 Q 150,20 260,110" fill="none" stroke="url(#lu-accent)" stroke-width="4" />
    <text x="25" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Metasphere VR</text>
    <text x="25" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#8888aa">Spatial Computing Portfolio • FWA of the Month</text>
  </g>

  <g transform="translate(780, 380)">
    <rect x="0" y="0" width="300" height="210" rx="14" fill="#171724" stroke="rgba(255,255,255,0.08)" />
    <!-- Gradient Art inside card 3 -->
    <rect x="15" y="15" width="270" height="130" rx="8" fill="#161c2e" />
    <rect x="50" y="45" width="70" height="70" rx="12" fill="#3b82f6" opacity="0.4" />
    <rect x="90" y="30" width="70" height="70" rx="12" fill="#ec4899" opacity="0.5" />
    <text x="25" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Chronos Kinetic Watch</text>
    <text x="25" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#8888aa">Luxury Watch Launch • CSSDA Best UI</text>
  </g>
</svg>
